version: 2
builds:
  -
    main: .
    ldflags:
      - >-
        -s -w
        -X main.version={{.Version}}
        -X main.commit={{.FullCommit}}
        -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - ppc64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm

checksum:
    name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
