name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to verify (defaults to the event SHA)
        type: string
        required: false
        default: ''
    outputs:
      sha:
        description: Verified commit SHA
        value: ${{ jobs.verify.outputs.sha }}
      tag:
        description: Release tag, or empty for a normal test run
        value: ${{ jobs.verify.outputs.tag }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target-commit.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Validate inputs and select target
        id: target
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          fail() { echo "$*" >&2; exit 1; }

          target=${INPUT_REF:-$GITHUB_SHA}
          tag=''
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || fail 'Manual releases must run on main'
            tag=$INPUT_TAG
            [[ "$tag" =~ $pattern ]] || fail 'Invalid release tag'
            existing_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
              --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
            if [[ -n "$existing_ref" ]]; then
              target=$existing_ref
            fi
          elif [[ "$target" == refs/tags/* ]]; then
            tag=${target#refs/tags/}
            [[ "$tag" =~ $pattern ]] || fail 'Invalid release tag'
          fi
          printf 'ref=%s\ntag=%s\n' "$target" "$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record target commit
        id: target-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  gofmt:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check formatting
        run: mise run fmt:check

  dependencies:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check dependencies
        run: mise run deps:check

  vet:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Vet
        run: mise run vet

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Test
        run: mise run test

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Build
        run: mise run build

  goreleaser-check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@5742e2a039330cbb23ebf35f046f814d4c6ff811 # v5
        with:
          version: ~> v2
          args: check

  verify:
    if: ${{ always() }}
    needs: [prepare, gofmt, dependencies, vet, test, build, goreleaser-check]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Require all checks to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$CHECK_RESULTS"
